<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avvisi della Settimana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-brand">
            <div class="header-croce"></div>
            <div class="header-nome">
                Parrocchia di …
                <span>Diocesi di …</span>
            </div>
        </div>
        <nav class="site-nav">
            <a href="index.html" class="active">Avvisi</a>
            <a href="bacheca.html">Bacheca</a>
        </nav>
    </header>

    <main>
        <div class="hero-avviso">

            <!-- LATO SINISTRO: testo -->
            <div class="hero-lato-testo">
                <p class="kicker">Settimana in corso</p>
                <h1 class="hero-titolo" id="titoloPagina">Avvisi della Settimana</h1>
                <p class="hero-data" id="sottotitoloPagina">Caricamento in corso…</p>
                <a href="#" class="btn-primario" id="btnScarica" style="display:none;" download>
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Scarica il foglio
                </a>
            </div>

            <!-- LATO DESTRO: immagine -->
            <div class="hero-lato-immagine">
                <div class="hero-immagine-wrap" id="contenitoreImmagine">
                    <div class="loader-area" id="loaderArea">
                        <div class="spinner"></div>
                        <span>Caricamento…</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">Parrocchia di …</div>
        <div class="footer-contatti">Tel. … &nbsp;·&nbsp; … &nbsp;·&nbsp; Via …, …</div>
    </footer>

    <script>
        // ══════════════════════════════════════════
        //  CONFIGURAZIONE
        // ══════════════════════════════════════════
        const WORKER_URL = 'https://bacheca-worker.leogall2002.workers.dev/api/latest';
        const R2_DOMAIN = 'https://r2.lmetal.dev';
        // ══════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', caricaAvviso);

        async function caricaAvviso() {
            try {
                const res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error(`Errore server: ${res.status}`);

                const dati = await res.json();
                if (!dati || (Array.isArray(dati) && dati.length === 0) || Object.keys(dati).length === 0) {
                    throw new Error('Nessun avviso disponibile al momento.');
                }

                const item = Array.isArray(dati) ? dati[0] : dati;
                const urlRaw = item.url || item.imageUrl || item.image || '';
                const url = urlRaw.startsWith('http') ? urlRaw : `${R2_DOMAIN}/${urlRaw}`;
                const titolo = item.titolo || item.title || 'Avvisi della Settimana';
                const dataStr = item.data || item.date || item.createdAt || '';

                if (!url) throw new Error('Nessuna immagine trovata.');

                mostraImmagine(url, titolo, dataStr);

            } catch (e) {
                console.error(e);
                mostraErrore(e.message);
            }
        }

        function mostraImmagine(url, titolo, dataStr) {
            const wrap = document.getElementById('contenitoreImmagine');
            const btnScarica = document.getElementById('btnScarica');

            const img = new Image();
            img.src = url;
            img.alt = titolo;

            img.onload = () => {
                wrap.innerHTML = '';
                wrap.appendChild(img);
                requestAnimationFrame(() => img.classList.add('visibile'));

                document.getElementById('titoloPagina').textContent = titolo;
                document.getElementById('sottotitoloPagina').textContent =
                    dataStr ? formattaData(dataStr) : 'Ultimo aggiornamento disponibile';

                btnScarica.href = url;
                btnScarica.style.display = 'inline-flex';
            };

            img.onerror = () => mostraErrore('Impossibile caricare l\'immagine.');
        }

        function mostraErrore(msg) {
            document.getElementById('contenitoreImmagine').innerHTML = `
            <div class="errore-box">
                <p>${msg}</p>
                <button class="btn-outline" onclick="location.reload()">Riprova</button>
            </div>
        `;
            document.getElementById('sottotitoloPagina').textContent = '';
        }

        function formattaData(s) {
            try {
                let d = new Date(s);
                if (s && typeof s === 'string' && s.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    const datePart = s.substring(0, 10);
                    const timePart = s.substring(11).trim();
                    const [giorno, mese, anno] = datePart.split('/');
                    
                    if (timePart) {
                        const [ore, minuti, secondi] = timePart.split(':');
                        d = new Date(anno, mese - 1, giorno, ore || 0, minuti || 0, secondi || 0);
                    } else {
                        d = new Date(anno, mese - 1, giorno);
                    }
                }
                if (isNaN(d)) return s;
                return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            } catch { return s; }
        }
    </script>

</body>

</html>
