<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avvisi della Settimana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-brand">
            <div class="header-croce"></div>
            <div class="header-nome">
                Parrocchia di …
                <span>Diocesi di …</span>
            </div>
        </div>
        <nav class="site-nav">
            <a href="index.html" class="active">Avvisi</a>
            <a href="bacheca.html">Bacheca</a>
        </nav>
    </header>

    <main>
        <div class="hero-avviso">

            <!-- LATO SINISTRO: testo -->
            <div class="hero-lato-testo">
                <p class="kicker">Settimana in corso</p>
                <h1 class="hero-titolo" id="titoloPagina">Avvisi della Settimana</h1>
                <p class="hero-data" id="sottotitoloPagina">Caricamento in corso…</p>
                <a href="#" class="btn-primario" id="btnScarica" style="display:none;" download>
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Scarica il foglio
                </a>
            </div>

            <!-- LATO DESTRO: immagine -->
            <div class="hero-lato-immagine">
                <div class="hero-immagine-wrap" id="contenitoreImmagine">
                    <div class="loader-area" id="loaderArea">
                        <div class="spinner"></div>
                        <span>Caricamento…</span>
                    </div>
                </div>
            </div>

        </div>

        <section class="calendario-section">
            <div class="calendario-header">
                <div class="calendario-titolo-wrap">
                    <p class="kicker">Prossimamente</p>
                    <h2 class="calendario-titolo">Calendario Eventi</h2>
                </div>
                <div class="calendario-filtri" id="calendarioFiltri" style="display: none;">
                    <select id="filtroLuogo" class="filtro-select" aria-label="Filtra per luogo">
                        <option value="tutti">Tutti i luoghi</option>
                    </select>
                </div>
            </div>
            <div class="calendario-lista" id="calendarioLista">
                <div class="loader-area">
                    <div class="spinner"></div>
                    <span>Caricamento eventi…</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">Parrocchia di …</div>
        <div class="footer-contatti">Tel. … &nbsp;·&nbsp; … &nbsp;·&nbsp; Via …, …</div>
    </footer>

    <script>
        // ══════════════════════════════════════════
        //  CONFIGURAZIONE
        // ══════════════════════════════════════════
        const WORKER_URL = 'https://bacheca-worker.leogall2002.workers.dev/api/latest';
        const CALENDAR_URL = 'https://bacheca-worker.leogall2002.workers.dev/api/calendar';
        const R2_DOMAIN = 'https://r2.lmetal.dev';
        // ══════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', () => {
            caricaAvviso();
            caricaCalendario();
        });

        async function caricaAvviso() {
            try {
                const res = await fetch(WORKER_URL);
                if (!res.ok) throw new Error(`Errore server: ${res.status}`);

                const dati = await res.json();
                if (!dati || (Array.isArray(dati) && dati.length === 0) || Object.keys(dati).length === 0) {
                    throw new Error('Nessun avviso disponibile al momento.');
                }

                const item = Array.isArray(dati) ? dati[0] : dati;
                const urlRaw = item.url || item.imageUrl || item.image || '';
                const url = urlRaw.startsWith('http') ? urlRaw : `${R2_DOMAIN}/${urlRaw}`;
                const titolo = item.titolo || item.title || 'Avvisi della Settimana';
                const dataStr = item.data || item.date || item.createdAt || '';

                if (!url) throw new Error('Nessuna immagine trovata.');

                mostraImmagine(url, titolo, dataStr);

            } catch (e) {
                console.error(e);
                mostraErrore(e.message);
            }
        }

        function mostraImmagine(url, titolo, dataStr) {
            const wrap = document.getElementById('contenitoreImmagine');
            const btnScarica = document.getElementById('btnScarica');

            const img = new Image();
            img.src = url;
            img.alt = titolo;

            img.onload = () => {
                wrap.innerHTML = '';
                wrap.appendChild(img);
                requestAnimationFrame(() => img.classList.add('visibile'));

                document.getElementById('titoloPagina').textContent = titolo;
                document.getElementById('sottotitoloPagina').textContent =
                    dataStr ? formattaData(dataStr) : 'Ultimo aggiornamento disponibile';

                btnScarica.href = url;
                btnScarica.style.display = 'inline-flex';
            };

            img.onerror = () => mostraErrore('Impossibile caricare l\'immagine.');
        }

        function mostraErrore(msg) {
            document.getElementById('contenitoreImmagine').innerHTML = `
            <div class="errore-box">
                <p>${msg}</p>
                <button class="btn-outline" onclick="location.reload()">Riprova</button>
            </div>
        `;
            document.getElementById('sottotitoloPagina').textContent = '';
        }

        function formattaData(s) {
            try {
                let d = new Date(s);
                if (s && typeof s === 'string' && s.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    const datePart = s.substring(0, 10);
                    const timePart = s.substring(11).trim();
                    const [giorno, mese, anno] = datePart.split('/');

                    if (timePart) {
                        const [ore, minuti, secondi] = timePart.split(':');
                        d = new Date(anno, mese - 1, giorno, ore || 0, minuti || 0, secondi || 0);
                    } else {
                        d = new Date(anno, mese - 1, giorno);
                    }
                }
                if (isNaN(d)) return s;
                return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            } catch { return s; }
        }

        let tuttiEventi = [];

        async function caricaCalendario() {
            try {
                const res = await fetch(CALENDAR_URL);
                if (!res.ok) throw new Error(`Errore server: ${res.status}`);

                tuttiEventi = await res.json();
                popolaFiltri(tuttiEventi);
                mostraCalendario(tuttiEventi);
            } catch (e) {
                console.error('Errore calendario:', e);
                document.getElementById('calendarioLista').innerHTML = `
                    <div class="errore-box" style="margin: 0 auto; padding: 2rem 0;">
                        <p>Impossibile caricare gli eventi al momento.</p>
                        <button class="btn-outline" onclick="caricaCalendario()">Riprova</button>
                    </div>`;
            }
        }

        function popolaFiltri(eventi) {
            const select = document.getElementById('filtroLuogo');
            const filtriContainer = document.getElementById('calendarioFiltri');

            if (!eventi || eventi.length === 0) return;

            const luoghi = [...new Set(eventi.map(e => e.luogo).filter(l => l && l.trim() !== ''))].sort();

            if (luoghi.length > 0) {
                select.innerHTML = '<option value="tutti">Tutti i luoghi</option>';
                luoghi.forEach(luogo => {
                    const opt = document.createElement('option');
                    opt.value = luogo;
                    opt.textContent = luogo;
                    select.appendChild(opt);
                });

                filtriContainer.style.display = 'block';

                select.onchange = (e) => {
                    const selezionato = e.target.value;
                    if (selezionato === 'tutti') {
                        mostraCalendario(tuttiEventi);
                    } else {
                        const filtrati = tuttiEventi.filter(ev => ev.luogo === selezionato);
                        mostraCalendario(filtrati);
                    }
                };
            }
        }

        function mostraCalendario(eventi) {
            const container = document.getElementById('calendarioLista');
            if (!eventi || eventi.length === 0) {
                container.innerHTML = '<p class="vuoto-testo">Nessun evento in programma.</p>';
                return;
            }

            const html = eventi.map(evento => {
                const dataFormat = formattaDataEvento(evento.data);
                const ora = evento.ora_inizio ? `${evento.ora_inizio}${evento.ora_fine ? ' - ' + evento.ora_fine : ''}` : '';

                return `
                    <div class="evento-card">
                        <div class="evento-data-box">
                            ${dataFormat.giornoStr ? `<span class="evento-giorno-settimana">${dataFormat.giornoStr}</span>` : ''}
                            <span class="evento-giorno">${dataFormat.giorno}</span>
                            <span class="evento-mese">${dataFormat.mese}</span>
                        </div>
                        <div class="evento-dettagli">
                            <h3 class="evento-nome">${evento.titolo}</h3>
                            <div class="evento-meta">
                                ${ora ? `<span class="meta-item"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${ora}</span>` : ''}
                                ${evento.luogo ? `<span class="meta-item"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${evento.luogo}</span>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function formattaDataEvento(dataStr) {
            if (!dataStr) return { giornoStr: '', giorno: '-', mese: '-' };
            const parti = dataStr.split('-');
            if (parti.length === 3) {
                const date = new Date(`${parti[2]}-${parti[1]}-${parti[0]}`);
                if (!isNaN(date)) {
                    const giornoStr = date.toLocaleString('it-IT', { weekday: 'short' }).replace('.', '').toUpperCase();
                    const giorno = date.getDate();
                    const mese = date.toLocaleString('it-IT', { month: 'short' }).replace('.', '').toUpperCase();
                    return { giornoStr, giorno, mese };
                }
            }
            return { giornoStr: '', giorno: dataStr, mese: '' };
        }
    </script>

</body>

</html>
