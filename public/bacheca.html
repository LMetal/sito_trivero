<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacheca Avvisi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-brand">
            <div class="header-croce"></div>
            <div class="header-nome">
                Parrocchia di …
                <span>Diocesi di …</span>
            </div>
        </div>
        <nav class="site-nav">
            <a href="index.html">Avvisi</a>
            <a href="bacheca.html" class="active">Bacheca</a>
        </nav>
    </header>

    <main>
        <div class="bacheca-header">
            <p class="kicker">Archivio</p>
            <h1>Tutti gli avvisi<br>passati</h1>
        </div>

        <div class="bacheca-grid" id="griglia">
            <div class="stato-griglia">
                <div class="spinner"></div>
                <span>Caricamento…</span>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-brand">Parrocchia di …</div>
        <div class="footer-contatti">Tel. … &nbsp;·&nbsp; … &nbsp;·&nbsp; Via …, …</div>
    </footer>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
        <div class="lb-contenuto">
            <div class="lb-bar">
                <h2 class="lb-titolo" id="lbTitolo"></h2>
                <button class="lb-chiudi" onclick="chiudiLightbox()" aria-label="Chiudi">✕</button>
            </div>
            <div class="lb-img-wrap">
                <img src="" alt="" id="lbImg">
            </div>
            <div class="lb-footer">
                <button class="btn-outline" onclick="chiudiLightbox()">Chiudi</button>
                <a href="#" class="btn-primario" id="lbScarica" download>
                    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
                        style="width:15px;height:15px">
                        <path d="M8 2v8M5 7l3 3 3-3M3 13h10" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Scarica
                </a>
            </div>
        </div>
    </div>

    <script>
        // ══════════════════════════════════════════
        //  CONFIGURAZIONE
        // ══════════════════════════════════════════
        const WORKER_URL_LISTA = 'https://bacheca-worker.leogall2002.workers.dev/api/list';
        const R2_DOMAIN = 'https://r2.lmetal.dev';
        // ══════════════════════════════════════════

        document.addEventListener('DOMContentLoaded', caricaBacheca);

        async function caricaBacheca() {
            const griglia = document.getElementById('griglia');
            try {
                const res = await fetch(WORKER_URL_LISTA);
                if (!res.ok) throw new Error(`Errore server: ${res.status}`);

                const dati = await res.json();
                const lista = Array.isArray(dati) ? dati : (dati.items || dati.data || []);

                griglia.innerHTML = '';

                if (!lista || lista.length === 0) {
                    griglia.innerHTML = '<div class="stato-griglia">Nessun avviso in archivio.</div>';
                    return;
                }

                lista.forEach((item, i) => {
                    const urlRaw = item.url || item.imageUrl || item.image || '';
                    const url = urlRaw.startsWith('http') ? urlRaw : `${R2_DOMAIN}/${urlRaw}`;
                    const titolo = item.titolo || item.title || 'Avvisi';
                    const dataStr = item.data || item.date || item.createdAt || '';
                    const dataFmt = dataStr ? formattaData(dataStr) : '';

                    const card = document.createElement('div');
                    card.className = 'card-avviso';
                    card.setAttribute('role', 'button');
                    card.setAttribute('tabindex', '0');
                    card.setAttribute('aria-label', `Apri: ${titolo}`);
                    card.style.animationDelay = `${i * 40}ms`;

                    if (url) {
                        card.innerHTML = `
                        <div class="card-thumb">
                            <img src="${url}" alt="${titolo}" loading="lazy"
                                 onerror="this.parentElement.innerHTML='<div class=\'card-placeholder-inner\'><div class=\'placeholder-croce\'></div></div>'">
                        </div>
                        <div class="card-overlay"></div>
                        <div class="card-info">
                            ${dataFmt ? `<div class="card-data-label">${dataFmt}</div>` : ''}
                            <div class="card-titolo">${titolo}</div>
                        </div>
                    `;
                    } else {
                        card.innerHTML = `
                        <div class="card-placeholder-inner"><div class="placeholder-croce"></div></div>
                        <div class="card-overlay"></div>
                        <div class="card-info">
                            ${dataFmt ? `<div class="card-data-label">${dataFmt}</div>` : ''}
                            <div class="card-titolo">${titolo}</div>
                        </div>
                    `;
                    }

                    card.addEventListener('click', () => apriLightbox(url, titolo));
                    card.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') apriLightbox(url, titolo);
                    });
                    griglia.appendChild(card);
                });

            } catch (e) {
                console.error(e);
                griglia.innerHTML = `
                <div class="stato-griglia">
                    <p style="color:var(--grigio)">${e.message}</p>
                    <button class="btn-outline" onclick="caricaBacheca()">Riprova</button>
                </div>
            `;
            }
        }

        function apriLightbox(url, titolo) {
            document.getElementById('lbTitolo').textContent = titolo;
            document.getElementById('lbImg').src = url;
            document.getElementById('lbImg').alt = titolo;
            document.getElementById('lbScarica').href = url;
            document.getElementById('lightbox').classList.add('aperto');
            document.body.style.overflow = 'hidden';
        }

        function chiudiLightbox() {
            document.getElementById('lightbox').classList.remove('aperto');
            document.getElementById('lbImg').src = '';
            document.body.style.overflow = '';
        }

        document.getElementById('lightbox').addEventListener('click', function (e) {
            if (e.target === this) chiudiLightbox();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') chiudiLightbox();
        });

        function formattaData(s) {
            try {
                let d = new Date(s);
                if (s && typeof s === 'string' && s.match(/^\d{2}\/\d{2}\/\d{4}/)) {
                    const datePart = s.substring(0, 10);
                    const timePart = s.substring(11).trim();
                    const [giorno, mese, anno] = datePart.split('/');
                    
                    if (timePart) {
                        const [ore, minuti, secondi] = timePart.split(':');
                        d = new Date(anno, mese - 1, giorno, ore || 0, minuti || 0, secondi || 0);
                    } else {
                        d = new Date(anno, mese - 1, giorno);
                    }
                }
                if (isNaN(d)) return s;
                return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
            } catch { return s; }
        }
    </script>

</body>

</html>
