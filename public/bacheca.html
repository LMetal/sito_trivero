<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Storico</title>
    <!-- Font minimale sans-serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bacheca-page">

    <!-- Menu minimalista -->
    <nav>
        <a href="index.html">Home</a>
        <a href="bacheca.html" class="active">Archivio</a>
    </nav>

    <main>
        <header>
            <h1>Archivio Storico</h1>
        </header>

        <div class="grid" id="gridContainer">
            <!-- Spinner di caricamento iniziale -->
            <div class="state-container" id="loadingState">
                <div class="loader"></div>
            </div>
        </div>
    </main>

    <!-- Logica JavaScript per Fetch -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchHistory();
        });

        async function fetchHistory() {
            const container = document.getElementById('gridContainer');

            try {
                // Endpoint API Cloudflare Worker
                const response = await fetch('https://bacheca-worker.leogall2002.workers.dev/api/history');

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Pulisce il container dal loader
                container.innerHTML = '';

                if (!data || !Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `
                        <div class="state-container">
                            <p>L'archivio è attualmente vuoto.</p>
                        </div>
                    `;
                    return;
                }

                // Generazione dinamica delle card
                // Si aspetta un oggetto simile a { "imageUrl": "...", "date": "...", "title": "..." }
                data.forEach(item => {
                    const imageUrl = item.url || item.imageUrl || item.image || '';
                    const date = item.data || item.date || 'Data sconosciuta';
                    const title = item.titolo || item.title || item.subject || 'Nessun oggetto';

                    const card = document.createElement('a');
                    card.href = '#'; // Da aggiornare con l'eventuale URL del post/immagine
                    card.className = 'card';

                    card.innerHTML = `
                        <div class="card-image">
                            <!-- Uso loading="lazy" per le performance -->
                            <img src="${imageUrl}" alt="${title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <span class="card-date">${formatDate(date)}</span>
                            <h2 class="card-title">${title}</h2>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Errore durante il recupero dello storico:', error);
                container.innerHTML = `
                    <div class="state-container">
                        <p>Impossibile caricare l'archivio al momento.</p>
                        <button class="retry-btn" onclick="retryFetch()">Riprova</button>
                    </div>
                `;
            }
        }

        function retryFetch() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = `
                <div class="state-container" id="loadingState">
                    <div class="loader"></div>
                </div>
            `;
            fetchHistory();
        }

        // Utility per formattare la data (es: "12 Ottobre 2023")
        function formatDate(dateString) {
            if (!dateString || dateString === 'Data sconosciuta') return 'Data sconosciuta';
            try {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString; // Fallback alla stringa passata se non parsabile
                return date.toLocaleDateString('it-IT', options);
            } catch (e) {
                return dateString;
            }
        }
    </script>
</body>

</html>
